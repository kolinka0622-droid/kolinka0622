<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>展位 3D 空間</title>
<style>
:root{
  --bg:#eceef1; --panel:#ffffff; --ink:#1d2430; --muted:#5d6675; --line:#cfd4dc; --accent:#1f4e8c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#161a20; --panel:#232932; --ink:#e8ebf0; --muted:#9aa4b2; --line:#3a424e; --accent:#7fb0ee; }
}
:root[data-theme="dark"]{ --bg:#161a20; --panel:#232932; --ink:#e8ebf0; --muted:#9aa4b2; --line:#3a424e; --accent:#7fb0ee; }
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.bar{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.bar>*{pointer-events:auto}
.grp{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;padding:8px 12px;cursor:pointer;border-right:1px solid var(--line)}
button:last-child{border-right:0}
button:hover{background:var(--bg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
button[aria-pressed="true"]{background:var(--accent);color:#fff}
.info{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--muted);max-width:min(340px,calc(100% - 24px))}
.info b{color:var(--ink)}
</style>
</head>
<body>
<canvas id="c" aria-label="展位 3D 空間，可拖曳旋轉、滾輪縮放"></canvas>
<div class="bar">
  <div class="grp" id="views">
    <button data-v="free" aria-pressed="true">斜視</button>
    <button data-v="front" aria-pressed="false">正面</button>
    <button data-v="top" aria-pressed="false">俯視</button>
    <button data-v="side" aria-pressed="false">側面</button>
  </div>
  <div class="grp">
    <button id="tWalls" aria-pressed="true">展位板牆</button>
    <button id="tPosters" aria-pressed="true">海報</button>
    <button id="tDims" aria-pressed="true">尺寸標註</button>
    <button id="tHuman" aria-pressed="false">170cm 人形</button>
    <button id="tSleep" aria-pressed="false">Reachy 睡眠</button>
    <button id="tHeader" aria-pressed="true">看板</button>
    <button id="tLamps" aria-pressed="true">投光燈</button>
  </div>
</div>
<div class="info">
  <b>展位 300×300×250H cm</b><br>
  左：接待桌 100×50×75H<br>
  右：階梯櫃（附鎖）100×50×75/100H，前低後高<br>
  左桌：Reachy Mini 30×20×15.5 ＋ Acer PD243Y E 雙螢幕（每片54.19×32.29，上下展開）<br>
  前上方：弧形看板＋10W LED 白光投光燈 ×8（看板3、後牆3、左右各1）<br>
  背景三面各 3 張海報 94×200cm，從牆頂往下貼<br>
  中央：玻璃圓桌 Ø75×75H ×1，折合鐵椅（黑）46×48×45H ×4<br>
  拖曳旋轉・滾輪／雙指縮放・右鍵或雙指平移
</div>

  dim([-28-27.095,DESK_TOP+70,128],[-28+27.095,DESK_TOP+70,128],'PD243Y E 寬 54.19');
  dim([4,DESK_TOP,134],[4,DESK_TOP+66.6,134],'展開 約66H（單片32.29）');


  // ---------- orbit controls (minimal) ----------
  var target=new THREE.Vector3(0,100,60);
  var sph={r:760, theta:0.55, phi:1.15}; // theta around Y from +z, phi from +Y
  var goal=null;
  function apply(){
    var s=Math.sin(sph.phi);
    camera.position.set(
      target.x + sph.r*s*Math.sin(sph.theta),
      target.y + sph.r*Math.cos(sph.phi),
      target.z + sph.r*s*Math.cos(sph.theta));
    camera.lookAt(target);
  }
  var pts={}, last=null, pinch=0;
  canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
  canvas.addEventListener('pointerdown',function(e){
    canvas.setPointerCapture(e.pointerId); pts[e.pointerId]={x:e.clientX,y:e.clientY,b:e.button}; goal=null;
    var k=Object.keys(pts); if(k.length===2){ var a=pts[k[0]],b=pts[k[1]]; pinch=Math.hypot(a.x-b.x,a.y-b.y);}
  });
  canvas.addEventListener('pointermove',function(e){
    var p=pts[e.pointerId]; if(!p) return;
    var k=Object.keys(pts);
    var dx=e.clientX-p.x, dy=e.clientY-p.y;
    if(k.length===2){
      p.x=e.clientX; p.y=e.clientY;
      var a=pts[k[0]],b=pts[k[1]]; var d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch>0){ sph.r=Math.min(1600,Math.max(120,sph.r*pinch/d)); }
      pinch=d; pan(dx/2,dy/2);
    } else if(p.b===2 || e.shiftKey){
      p.x=e.clientX; p.y=e.clientY; pan(dx,dy);
    } else {
      p.x=e.clientX; p.y=e.clientY;
      sph.theta-=dx*0.006; sph.phi=Math.min(Math.PI-0.05,Math.max(0.05,sph.phi-dy*0.006));
      setActive(null);
    }
    apply();
  });
  function up(e){ delete pts[e.pointerId]; pinch=0; }
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',function(e){ e.preventDefault(); sph.r=Math.min(1600,Math.max(120,sph.r*(1+e.deltaY*0.001))); apply(); },{passive:false});
  function pan(dx,dy){
    var k=sph.r*0.0016;
    var right=new THREE.Vector3(); right.setFromMatrixColumn(camera.matrix,0);
    var upv=new THREE.Vector3(); upv.setFromMatrixColumn(camera.matrix,1);
    target.addScaledVector(right,-dx*k).addScaledVector(upv,dy*k);
  }

  // ---------- UI ----------
  var viewBtns=document.querySelectorAll('#views button');
  function setActive(v){ viewBtns.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.v===v?'true':'false'); }); }
  var presets={
    free:{r:760,theta:0.55,phi:1.15,t:[0,100,60]},
    front:{r:900,theta:0,phi:Math.PI/2-0.02,t:[0,150,0]},
    top:{r:760,theta:0,phi:0.04,t:[0,0,20]},
    side:{r:900,theta:Math.PI/2,phi:Math.PI/2-0.02,t:[0,150,0]}
  };
  viewBtns.forEach(function(b){ b.addEventListener('click',function(){
    var p=presets[b.dataset.v]; goal={r:p.r,theta:p.theta,phi:p.phi,t:new THREE.Vector3(p.t[0],p.t[1],p.t[2])}; setActive(b.dataset.v);
  });});
  function toggle(id,fn){ var b=document.getElementById(id); b.addEventListener('click',function(){ var on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); fn(on); }); }
  toggle('tWalls',function(on){ walls.visible=on; });
  toggle('tPosters',function(on){ posters.visible=on; });
  toggle('tDims',function(on){ dims.visible=on; });
  toggle('tHuman',function(on){ human.visible=on; });
  toggle('tSleep',function(on){ reachy.setSleep(on); });
  toggle('tHeader',function(on){ header.visible=on; });
  toggle('tLamps',function(on){ lamps.visible=on; });

  function resize(){
    var w=window.innerWidth,h=window.innerHeight;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
    if(w<h){ camera.fov=58; } else { camera.fov=40; } camera.updateProjectionMatrix();
  }
  window.addEventListener('resize',resize); resize(); apply();

  function loop(){
    if(goal){
      var k=0.12;
      sph.r+=(goal.r-sph.r)*k; sph.theta+=(goal.theta-sph.theta)*k; sph.phi+=(goal.phi-sph.phi)*k;
      target.lerp(goal.t,k);
      if(Math.abs(goal.r-sph.r)<0.5 && Math.abs(goal.theta-sph.theta)<0.002 && Math.abs(goal.phi-sph.phi)<0.002){ goal=null; }
      apply();
    }
    var rn=performance.now()/1000; reachy.update(rn, rn-reachyLast); reachyLast=rn;
    for(var i=0;i<sprites.length;i++){
      var sp=sprites[i]; var k=Math.min(2.4,Math.max(0.35,camera.position.distanceTo(sp.position)/620));
      sp.scale.set(96*k,18*k,1);
    }
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
